service: afyalink-backend
window: 30d
slo:
  - name: api-availability
    objective: 99.9
    sli: http_success_ratio
    notes: All authenticated API endpoints except explicit 4xx policy denials.

  - name: auth-login-latency-p95
    objective: 95
    target: 600ms
    sli: endpoint_latency
    endpoint: /api/auth/login

  - name: readiness-latency-p95
    objective: 95
    target: 400ms
    sli: endpoint_latency
    endpoint: /readyz

  - name: spa-route-availability
    objective: 99.9
    sli: synthetic_pass_ratio
    notes: Direct-open route checks for /login and /app/platform/home/index from the live synthetic smoke suite.

  - name: public-settings-latency-p95
    objective: 95
    target: 700ms
    sli: endpoint_latency
    endpoint: /api/system-settings/public

  - name: offline-metrics-latency-p95
    objective: 95
    target: 900ms
    sli: endpoint_latency
    endpoint: /api/offline/metrics

  - name: dashboard-latency-p95
    objective: 95
    target: 1200ms
    sli: endpoint_latency
    endpoint_group:
      - /api/dashboard/super-admin
      - /api/dashboard/system-admin
      - /api/dashboard/hospital-admin

  - name: appointments-create-latency-p95
    objective: 95
    target: 900ms
    sli: endpoint_latency
    endpoint: /api/appointments

  - name: connector-ingestion-success
    objective: 99.5
    sli: connector_success_ratio

  - name: synthetic-smoke-pass-rate
    objective: 99.5
    sli: synthetic_pass_ratio
    notes: Frontend SPA routes, backend health checks, and authenticated role dashboards from each configured synthetic probe.
