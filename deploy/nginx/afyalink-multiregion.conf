upstream afyalink_backend {
    least_conn;
    server 127.0.0.1:8080; # local HAProxy frontend
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/afyalink/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afyalink/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://afyalink_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
