global
  log /dev/log local0
  log /dev/log local1 notice
  daemon
  maxconn 100000

defaults
  mode http
  log global
  option httplog
  option dontlognull
  option http-server-close
  option redispatch
  timeout connect 5s
  timeout client 120s
  timeout server 120s
  timeout tunnel 1h
  retries 3

frontend afya_api_in
  bind *:9000
  option forwardfor
  http-request set-header X-Forwarded-Proto https if { ssl_fc }
  acl is_websocket hdr(Upgrade) -i WebSocket
  acl is_socketio path_beg /socket.io/
  use_backend afya_api_pool if is_websocket or is_socketio
  default_backend afya_api_pool

backend afya_api_pool
  balance roundrobin
  cookie SRV insert indirect nocache
  option httpchk GET /readyz
  http-check expect status 200
  server api1 127.0.0.1:5001 check inter 3s fall 3 rise 2 cookie api1
  server api2 127.0.0.1:5002 check inter 3s fall 3 rise 2 cookie api2
