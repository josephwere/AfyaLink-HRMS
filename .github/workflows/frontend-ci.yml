name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

jobs:
  build-and-smoke:
    name: Build + Route Smoke
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Page API usage guard
        run: npm run check:page-api-usage

      - name: Route smoke check
        run: npm run ci:smoke-routes

      - name: Migration matrix report
        run: npm run generate:page-migration-matrix

      - name: Migration regression check
        run: npm run check:page-migration-regression

      - name: Upload migration report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: page-migration-report
          path: |
            frontend/docs/page-migration-matrix.md
            frontend/docs/page-migration-matrix.json

      - name: Production build
        run: npm run build
