name: Synthetic Live Smoke

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  production-smoke:
    name: Production Smoke Probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate backend lockfile
        run: |
          test -f pnpm-lock.yaml
          echo "Backend lockfile found: pnpm-lock.yaml"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run production live smoke suite
        env:
          BASE_URL: ${{ vars.SYNTHETIC_FRONTEND_BASE_URL || vars.SYNTHETIC_BASE_URL || 'https://afya-link-hrms-4.vercel.app' }}
          FRONTEND_BASE_URL: ${{ vars.SYNTHETIC_FRONTEND_BASE_URL || vars.SYNTHETIC_BASE_URL || 'https://afya-link-hrms-4.vercel.app' }}
          BACKEND_BASE_URL: ${{ vars.SYNTHETIC_BACKEND_BASE_URL || 'https://afya-link-hrms-frontend-4.onrender.com' }}
          PROBE_LABEL: github-default
          PROBE_REGION: github-us-east
          ROLE_FILTER: SUPER_ADMIN,HOSPITAL_ADMIN
          REQUIRED_ROLE_SUITES: SUPER_ADMIN
          SMOKE_SUMMARY_PATH: artifacts/ops/synthetic-live-smoke-summary.json
          SUPER_ADMIN_IDENTIFIER: ${{ secrets.SYNTHETIC_SUPER_ADMIN_IDENTIFIER }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SYNTHETIC_SUPER_ADMIN_PASSWORD }}
          HOSPITAL_ADMIN_IDENTIFIER: ${{ secrets.SYNTHETIC_HOSPITAL_ADMIN_IDENTIFIER }}
          HOSPITAL_ADMIN_PASSWORD: ${{ secrets.SYNTHETIC_HOSPITAL_ADMIN_PASSWORD }}
        run: node scripts/live-smoke-suite.mjs

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-live-smoke-summary
          path: backend/artifacts/ops/synthetic-live-smoke-summary.json
          if-no-files-found: ignore
